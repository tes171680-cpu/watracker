<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Database</title><link rel="stylesheet" href="css/style.css"></head><body>
<div class="topbar"><div class="nav"><div class="brand"><span class="logo">W</span>Database Admin</div><button id="adminLogout" class="pill">Logout</button></div></div>
<div class="wrap admin-wrap"><div class="admin-grid"><aside class="sidebar"><div id="tableList" class="menu"></div></aside><main class="panel"><div class="top"><div><div class="muted small">GOOGLE SHEETS DATABASE</div><h2 id="tableTitle">users</h2></div><button id="createCustomerBtn" class="btn">+ Create Customer</button></div><div class="toolbar"><input id="adminSearch" class="input" placeholder="Search"><button id="adminRefresh" class="btn secondary">Refresh</button></div><div class="tablebox"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div></main></div></div>
<div id="customerModal" class="modalbg"><div class="modal"><h2>Create Customer</h2><form id="customerForm"><div class="formgrid"><div class="formgroup"><label>Name</label><input class="input" name="name" required></div><div class="formgroup"><label>Email</label><input class="input" name="email" type="email" required></div><div class="formgroup"><label>Phone</label><input class="input" name="phone"></div><div class="formgroup"><label>Demo Access Code</label><input class="input" name="demo_code" type="text" minlength="4" required placeholder="Contoh: DEMO1234"></div></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" id="customerCancel" class="btn secondary">Cancel</button><button class="btn">Create</button></div></form></div></div>
<div id="rowModal" class="modalbg"><div class="modal"><h2>Edit Row</h2><form id="rowForm"><div id="rowFields" class="formgrid"></div><div class="actions" style="justify-content:flex-end;margin-top:16px"><button type="button" id="rowCancel" class="btn secondary">Cancel</button><button class="btn">Save</button></div></form></div></div>
<script src="js/config.js"></script><script src="js/common.js"></script><script src="js/admin.js"></script></body></html>
